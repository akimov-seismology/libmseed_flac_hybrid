name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with embedded libFLAC
        run: make -j2
      - name: Codec and integration tests
        run: make test-codec
      - name: Multithreaded repacking tests
        run: make test-threaded
      - name: Upstream regression tests
        run: make upstream-tests
